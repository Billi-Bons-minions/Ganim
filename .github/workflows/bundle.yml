name: App bundles (experimental)

# Builds self-contained folders (Python, Qt and Manim included; LaTeX not) with
# PyInstaller and renders a small scene with each of them. Started by hand only;
# the results are workflow artifacts, nothing is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config ffmpeg libegl1 libgl1 libxkbcommon0
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config
      - name: Install Manim Studio and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . "pyinstaller>=6"
      - name: Build and render a test scene with the bundle
        run: python packaging/build_bundle.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: manim-studio-${{ runner.os }}
          path: dist/
          retention-days: 14
