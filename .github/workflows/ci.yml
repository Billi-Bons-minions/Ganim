name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.5"
      # pyproject.toml limits the rules to real errors (F) and import order (I)
      - run: ruff check manim_studio tests tools examples packaging

  test:
    name: Tests (Python ${{ matrix.python }}${{ matrix.latex && ', LaTeX' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Python (Manim 0.19, PySide6 < 6.12), without LaTeX
          - python: "3.10"
            latex: false
          # newest Python with LaTeX, so that formulas are rendered as well
          - python: "3.13"
            latex: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (Cairo, Pango, FFmpeg, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: LaTeX
        if: matrix.latex
        run: |
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm cm-super
      - name: Install Manim Studio
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (including real Manim renders)
        run: pytest -q
