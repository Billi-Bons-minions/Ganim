[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-studio"
dynamic = ["version"]
description = "Create Manim animations with the mouse – no code required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Billi-Bons-minions" }]
requires-python = ">=3.10"
keywords = ["manim", "animation", "math", "education", "gui", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    # PySide6 6.12 crashes on Python < 3.12 ("deallocating None" after many drawing calls)
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "manim>=0.19",
    # used directly (Manim needs them as well)
    "numpy",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Billi-Bons-minions/Ganim"
Issues = "https://github.com/Billi-Bons-minions/Ganim/issues"
Changelog = "https://github.com/Billi-Bons-minions/Ganim/blob/main/CHANGELOG.md"

[project.scripts]
manim-studio = "manim_studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "manim_studio.__version__" }

[tool.setuptools.packages.find]
include = ["manim_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["manim: runs the real Manim renderer (slow, skipped if Manim is missing)"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# only real errors and import order; the code keeps its own formatting
select = ["F", "I"]
