[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-studio"
version = "1.0.0"
description = "Create Manim animations with the mouse – no code required."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "manim>=0.18"]

[project.scripts]
manim-studio = "manim_studio.app:main"

[tool.setuptools.packages.find]
include = ["manim_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["manim: runs the real Manim renderer (slow, skipped if Manim is missing)"]
